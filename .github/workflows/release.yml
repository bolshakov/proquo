name: Release 🚀
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tag 🏷️
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag against the package versions
        id: tag
        run: |
          node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  npm:
    name: npm Package 📦
    needs: [verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --ignore-scripts
      - run: npm test

      - name: Check the built CLI reports the tag version
        run: |
          npm run build --workspace proquo
          test "$(node packages/cli/bin/proquo.mjs --version)" = "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        run: npm publish --workspace proquo --provenance ${{ needs.verify.outputs.prerelease == 'true' && '--tag next' || '' }}
